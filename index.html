<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Our Head Trainer | Cherry Blossom Equestrian</title>

  <link rel="icon" type="image/png" href="dark logo square.png">

  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #fdfdfd;
      --text-main: #111111;
      --text-muted: #444444;
      --border-color: #e2e2e2;
      --sidebar-bg: #000000;
      --sidebar-text: #ffffff;
      --sidebar-hover: #222222;
      --accent-gold: #c59b27;
      --font-serif: "Georgia", "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Layout Structure */
    .app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- MOBILE HEADER & HAMBURGER MENU --- */
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--sidebar-bg);
      padding: 0.8rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .mobile-brand {
      color: #ffffff;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      text-decoration: none;
    }

    .hamburger-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      line-height: 1;
    }

    .mobile-nav-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--sidebar-bg);
      z-index: 200;
      flex-direction: column;
      padding: 1.5rem;
    }

    .mobile-nav-overlay.open {
      display: flex;
    }

    .mobile-nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333333;
    }

    .close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 2rem;
      cursor: pointer;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .mobile-nav-btn {
      background: none;
      border: none;
      color: #cccccc;
      text-align: left;
      padding: 0.8rem 1rem;
      font-size: 1.05rem;
      font-family: var(--font-sans);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .mobile-nav-btn:hover, .mobile-nav-btn.active {
      color: #ffffff;
      background-color: var(--sidebar-hover);
    }

    .mobile-nav-btn.active {
      border-left: 3px solid var(--accent-gold);
    }

    /* --- DESKTOP SIDEBAR --- */
    .sidebar {
      display: none; /* Hidden on mobile */
    }

    /* --- MAIN CONTENT AREA --- */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      width: 100%;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 720px;
      margin: 0 auto;
    }

    .trainer-title {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .trainer-title h2 {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666666;
    }

    .trainer-title h3 {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
    }

    .content-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
